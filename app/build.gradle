plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.10'
}

// Release signing: environment variables (CI), then Gradle properties, then .secret/signing.properties (local).
// Without a complete set the release build stays unsigned.
def localSigning = new Properties()
def localSigningFile = rootProject.file('.secret/signing.properties')
if (localSigningFile.exists()) {
    localSigningFile.withInputStream { localSigning.load(it) }
}

def signingValue = { String key, String env ->
    providers.environmentVariable(env).getOrNull() ?: providers.gradleProperty("osc.$key").getOrNull() ?: localSigning.getProperty(key)
}

def releaseStoreFile = signingValue('storeFile', 'OSC_STORE_FILE')
def releaseStorePassword = signingValue('storePassword', 'OSC_STORE_PASSWORD')
def releaseKeyAlias = signingValue('keyAlias', 'OSC_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'OSC_KEY_PASSWORD') ?: releaseStorePassword
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias

android {
    namespace 'kittoku.osc'

    compileSdk 36

    defaultConfig {
        applicationId "io.github.vgdotnet.osc"
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName "1.1.0"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue "string", "app_name", "Homeward"
        }
        debug {
            // separate package so the debug build can live next to the release build
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "Homeward dev"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        compose true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.navigation:navigation-compose:2.9.8'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
